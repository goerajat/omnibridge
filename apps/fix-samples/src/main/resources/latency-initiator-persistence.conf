# Latency Test - FIX Initiator with persistence
# Load after latency-initiator.conf (-c latency-initiator.conf,latency-initiator-persistence.conf):
# every message is written to the store (log-messages) but not traced to the application
# log, like the AWS latency test's --persistence. HOCON replaces arrays, so the session is
# restated in full.

fix-engine {
    sessions = [
        {
            session-id = "LATENCY_INITIATOR"
            role = "initiator"
            sender-comp-id = "CLIENT"
            target-comp-id = "EXCHANGE"
            begin-string = "FIX.4.4"
            host = "localhost"
            port = 9876

            heartbeat-interval = 30
            reset-on-logon = true
            reset-on-logout = false
            reset-on-disconnect = false

            reconnect-interval = 1
            max-reconnect-attempts = 5
            time-zone = "UTC"

            log-messages = true
            trace-messages = false
            max-message-length = 512
            max-tag-number = 10000

            start-time = ""
            end-time = ""
            eod-time = ""
            reset-on-eod = false
        }
    ]
}
