# Latency Test - FIX Acceptor with persistence
# Load after latency-acceptor.conf (-c latency-acceptor.conf,latency-acceptor-persistence.conf):
# every message is written to the store (log-messages) but not traced to the application
# log, like the AWS latency test's --persistence. HOCON replaces arrays, so the session is
# restated in full.

fix-engine {
    sessions = [
        {
            session-id = "LATENCY_ACCEPTOR"
            role = "acceptor"
            sender-comp-id = "EXCHANGE"
            target-comp-id = "CLIENT"
            begin-string = "FIX.4.4"
            port = 9876

            heartbeat-interval = 30
            reset-on-logon = true
            reset-on-logout = false
            reset-on-disconnect = false

            reconnect-interval = 5
            max-reconnect-attempts = -1
            time-zone = "UTC"

            log-messages = true
            trace-messages = false
            max-message-length = 512
            max-tag-number = 10000

            start-time = ""
            end-time = ""
            eod-time = ""
            reset-on-eod = false
        }
    ]
}
