mcp-server {
  transport = "stdio"        # stdio | http
  port = 8090                # HTTP/SSE port (when transport=http)

  persistence {
    store-type = "chronicle"
    base-path = "./data/logs"
  }

  query {
    default-limit = 100
    max-limit = 1000
  }

  index {
    enabled = false
    data-dir = "./data/fix-index"
    checkpoint-interval = 1000   # entries between checkpoint saves
  }
}
