# Default configuration for FIX Engine
# This file provides defaults that can be overridden by application.conf or custom config files

# Network event loop configuration
network {
  # Thread name for the event loop
  name = "fix-event-loop"

  # CPU affinity (-1 = no affinity, 0+ = specific core)
  cpu-affinity = -1

  # Read buffer size per connection (bytes)
  read-buffer-size = 65536

  # Write buffer size per connection (bytes)
  write-buffer-size = 65536

  # Selector timeout in milliseconds
  select-timeout-ms = 100

  # Busy spin mode - uses selectNow() instead of select() for lower latency
  # Warning: This will consume 100% CPU on the event loop thread
  busy-spin-mode = false

  # A message committed on the event-loop thread (a reply built in a read callback) is written
  # before the commit returns, instead of after the callback and the rest of the loop iteration.
  # Messages committed ahead of it in the ring still go first. false: always wait for the loop.
  write-on-loop-commit = true

  # Which stack moves the bytes: "kernel" (NIO sockets on a selector, the default) or the name
  # of a TransportProvider on the class path ("fstack": FreeBSD TCP on DPDK, module
  # network-dpdk). A userspace transport polls from the event loop's own thread, so it needs
  # busy-spin-mode = true and cpu-affinity >= 0, and takes its settings from a block of its
  # own name:
  #   fstack {
  #     conf = "/opt/fstack/fstack.ini"                  # F-Stack ini (lcore_mask, port_list, pkt_tx_delay = 0)
  #     library = "/opt/fstack/libomnibridge-fstack.so"  # the shim built on the host
  #   }
  transport = "kernel"
}

# Persistence store configuration
persistence {
  # Enable/disable persistence
  enabled = true

  # Store type: memory-mapped, chronicle, none
  store-type = "chronicle"

  # Base directory for persistence files
  base-path = "./fix-logs"

  # Maximum file size per stream (supports units: KB, MB, GB)
  max-file-size = 256MB

  # Force sync to disk on each write
  sync-on-write = false

  # Maximum number of concurrent streams
  max-streams = 100

  # Chronicle store: a background thread keeps this much of each stream's journal
  # faulted in ahead of the write position, so the writer never takes a first-touch
  # page fault (one per 4 KB written otherwise) or maps the next 64 MB chunk itself.
  # 0 turns it off. Supports units: KB, MB.
  pretouch-ahead = 1MB
  pretouch-interval-ms = 10
}

fix-engine {

  # Session defaults (can be overridden per session)
  session-defaults {
    begin-string = "FIX.4.4"
    heartbeat-interval = 30
    reset-on-logon = false
    reset-on-logout = false
    reset-on-disconnect = false
    reconnect-interval = 5
    max-reconnect-attempts = -1
    time-zone = "UTC"
    reset-on-eod = false
    log-messages = true
    max-message-length = 4096
    max-tag-number = 1000
    start-time = ""
    end-time = ""
    eod-time = ""
  }

  # Sessions list (empty by default, must be provided in application config)
  sessions = []

  # Most bytes a session takes from the socket in one read (a session may set its own
  # read-cap-bytes). One read can bring several messages; all are processed before the
  # loop sends their replies, so a larger cap delays the first reply in a burst.
  # A read that fills the cap is counted (WARN on the first per connection).
  read-cap-bytes = 2048

  # Per-message stage timestamps (claim, commit, drain, write; read, frame, parse,
  # dispatch, callback) for latency analysis. Off by default; switch on with
  # -Dfix-engine.stage-timing.enabled=true. capacity = rows kept per session and direction.
  stage-timing {
    enabled = false
    capacity = 131072
  }
}
